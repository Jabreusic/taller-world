[build]
  publish = "."
  # Skip build when there are no file changes between commits.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.processing]
  # Keep processing enabled so headers/redirect rules still work as expected.
  skip_processing = false

[build.processing.images]
  # Image optimization on Netlify is expensive for this repo's large PNG set.
  compress = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false
